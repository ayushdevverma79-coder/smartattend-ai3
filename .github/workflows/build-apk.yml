name: Build Android APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip if present
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o "*.zip"
            rm -f *.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@://github.com"
            git add .
            git commit -m "Extract project zip" || exit 0
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Capacitor & Android
        run: |
          mkdir -p www
          echo "<h1>Loading...</h1>" > www/index.html
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "AttendanceApp" "com.attendance.app" --web-dir=www
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.attendance.app",
            "appName": "AttendanceApp",
            "webDir": "www",
            "server": {
              "url": "https://vercel.app",
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
